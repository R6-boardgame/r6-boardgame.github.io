<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Twitch 操作與模型測試（離線資料）</title>

<body data-scr="game"><nav><button id="deploy">部署到鄰格</button><button id="next">下一回合</button><button id="death">Twitch 陣亡</button><button id="beam">測試電擊</button><div id="status"></div></nav><div id="faces"></div><div id="sheetT"><p>電擊無人機 · 實際按鈕／模型</p><div id="acts"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script><script>
(async()=>{const html=await(await fetch('index.html')).text();const css=document.createElement('style');css.textContent=html.split('\n').filter(l=>l.startsWith('#twBtn')).join('\n');document.head.append(css);
const cut=(a,b)=>html.slice(html.indexOf(a),html.indexOf(b,html.indexOf(a)));
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,30);camera.position.set(1.3,1.5,2.1);camera.lookAt(0,.15,0);scene.add(new THREE.HemisphereLight(0xffffff,0x37414c,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);
const BOX3=new THREE.BoxGeometry(1,1,1),CYL3=new THREE.CylinderGeometry(1,1,1,20),SPH3=new THREE.SphereGeometry(1,16,12),std=(color,opt)=>new THREE.MeshStandardMaterial({color,...opt}),cache={},gm=(key,make)=>cache[key]||(cache[key]=make());
const R3={fxG:new THREE.Group(),fx2:[]};scene.add(R3.fxG);const cwx=x=>x,cwz=(x,y)=>y;
let G={round:1,acts:0,phase:'play',player:'A',units:[],gadgets:[],mode:'move'},GB=null;const u={op:'twitch',id:'A0',alive:true,side:'A',x:0,y:0,ap:2,ch:2,used:new Set()},d={id:'twA0:1',type:'drone',own:'twitch',op:'twitch',by:'A0',side:'A',alive:true,x:0,y:0,mp:5,fd:[0,1]};G.sel=u;G.units=[u];
const tt=s=>s,curSide=()=> 'A',followCam=()=>{},jammed=()=>false,canDo=(u,k)=>u.ap>0&&!u.used.has(k),inFan=()=>true,los=()=>true,GSTR={},commit=()=>true,playerAfterAct=()=>{},adj8all=()=>[],droneReach=()=>new Map();
eval(cut('function twUser(','// ---------- phases ----------')+cut('function seg3(','function wire3D(')+';window.twTest={twModel,twBtnUpd,twActs,twBeam,twDieFace,twCan,twSight};');
const model=new THREE.Group();twTest.twModel(d,model);scene.add(model);for(const face of ['miss','miss','miss','hit','hit','hit'])document.querySelector('#faces').append(twTest.twDieFace(face));
function render(){twTest.twBtnUpd();if(u.twControl&&u.alive)twTest.twActs(u,document.querySelector('#acts'));else document.querySelector('#acts').textContent=u.alive?'本體控制':'Twitch 已陣亡：電車保留視野，無法操作';document.querySelector('#status').textContent='回合 '+G.round+' · '+(u.twControl?'電車':'本體')+' · '+(u.twRound===G.round?'已鎖定':'可切換');}
document.querySelector('#deploy').onclick=()=>{if(!u.alive||G.gadgets.length)return;G.gadgets.push(d);u.twControl=true;u.twRound=G.round;u.twActor='drone';render()};document.querySelector('#next').onclick=()=>{G.round++;render()};document.querySelector('#death').onclick=()=>{u.alive=false;render()};document.querySelector('#beam').onclick=()=>twTest.twBeam({x0:0,y0:0,x1:.8,y1:.5});render();
let t=performance.now();function tick(n){requestAnimationFrame(tick);R3.fx2=R3.fx2.filter(f=>f((n-t)/1000));t=n;renderer.render(scene,camera)}requestAnimationFrame(tick);
})().catch(e=>{document.querySelector('#status').textContent=e.stack});
