<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="R6 桌遊">
  <link rel="icon" href="i4-32.png">
  <link rel="apple-touch-icon" href="i4-180.png">
  <link rel="manifest" href="app2.webmanifest?v=284">
  <title>虹彩六號 戰術桌遊</title>
  <style>
    html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#06090d;color:#eee}
    #r6PortraitStage{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden}
    #r6PortraitFrame{position:absolute;display:block;left:50%;top:50%;border:0;max-width:none;max-height:none;background:#06090d;transform-origin:center;transition:none;width:var(--pw,100%);height:var(--ph,100%);transform:translate(-50%,-50%)}
    /* v277: the turn is applied by CSS on the very first landscape frame, so the sideways page never shows before the script catches up */
    @media (orientation:landscape){#r6PortraitFrame{width:var(--lw,100vh);height:var(--lh,100vw);transform:translate(-50%,-50%) rotate(var(--la,-90deg)) scale(var(--ls,1))}}
  </style>
</head>
<body>
  <main id="r6PortraitStage"></main>
  <noscript>請開啟 JavaScript 以遊玩。</noscript>
  <script src="portrait.js?v=277"></script>
</body>
</html>
